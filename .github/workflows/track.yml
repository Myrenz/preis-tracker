name: Preis-Tracker

on:
  schedule:
    - cron: "17 5 * * *"    # täglich ca. 07:17 deutscher Zeit (Sommerzeit)
  workflow_dispatch:

concurrency:
  group: preis-tracker
  cancel-in-progress: false

permissions:
  contents: read             # kein Schreibzugriff nötig -> keine Push-Konflikte

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tracker.py
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preishistorie-artifact
          path: |
            debug/
            preishistorie.csv
          if-no-files-found: ignore
          retention-days: 14

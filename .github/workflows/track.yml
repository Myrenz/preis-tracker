name: Preis-Tracker

on:
  schedule:
    # Läuft ab sofort alle 8 Stunden (um 0:00, 8:00 und 16:00 Uhr UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Ermöglicht auch weiterhin den manuellen "Run workflow"-Knopf

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Tracker Script
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python tracker.py

      - name: Commit and push changes if price updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@example.com"
          git add preishistorie.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisches Preis-Update (Alle 8h)" && git push)

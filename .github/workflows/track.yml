name: Preis-Tracker

on:
  schedule:
    # Läuft jeden Tag automatisch um 08:00 Uhr UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests beautifulsoup4; fi

      - name: Preis-Tracker ausführen
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python tracker.py

      - name: Ergebnisse in CSV speichern und pushen
        run: |
          git config --global user.name "PriceBot"
          git config --global user.email "bot@noreply.github.com"
          git add preishistorie.csv || true
          git commit -m "Automatischer Preis-Check aktualisiert" || exit 0
          git pull --rebase origin main || true
          git push origin main

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream World Palace - Preisverlauf 2027</title>
    <!-- Chart.js für die schicke Preiskurve -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #1a73e8; margin-top: 0; }
        .chart-container { position: relative; height: 400px; width: 100%; margin-top: 20px; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel Preisverlauf: Dream World Palace (Juni 2027)</h1>
        <p>Täglich automatisiert getrackte Pauschalreise-Gesamtpreise (2 Erw., All Inclusive, ab FMO/BRE).</p>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
        <div class="footer">Automatisch aktualisiert durch GitHub Actions &bull; Preis-Tracker</div>
    </div>

    <script>
        async function loadCSV() {
            const response = await fetch('preishistorie.csv');
            const data = await response.text();
            const rows = data.split('\n').slice(1); // Überschrift überspringen
            
            const labels = [];
            const prices = [];

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 3 && cols[0].trim() !== "") {
                    labels.push(cols[0].trim()); // Zeitstempel
                    const price = parseFloat(cols[2].trim());
                    if (!isNaN(price)) {
                        prices.push(price);
                    } else {
                        prices.push(null);
                    }
                }
            });

            const ctx = document.getElementById('priceChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Günstigster Gesamtpreis (EUR)',
                        data: prices,
                        borderColor: '#1a73e8',
                        backgroundColor: 'rgba(26, 115, 232, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 5,
                        pointBackgroundColor: '#1a73e8'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: { callback: function(value) { return value + ' €'; } }
                        }
                    }
                }
            });
        }
        loadCSV();
    </script>
</body>
</html>

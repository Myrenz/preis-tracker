<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel-Preisvergleich Türkische Riviera 2027</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 26px; color: #1a73e8; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card-img-container { width: 100%; height: 160px; background: #e0e0e0; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-body { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .card-title { font-size: 15px; font-weight: bold; margin: 0 0 10px 0; color: #222; }
        .price-tag { font-size: 20px; font-weight: bold; color: #1a73e8; }

        .chart-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel-Preisvergleich Türkische Riviera (Juni 2027)</h1>
        <div class="subtitle">Täglicher, automatisierter Gesamtpreis-Check (2 Erw., All Inclusive, ab FMO/BRE).</div>

        <div class="grid" id="hotelGrid"></div>

        <div class="chart-box">
            <canvas id="comparisonChart"></canvas>
        </div>
    </div>

    <script>
        // Echte Original-Bilder direkt aus den HolidayCheck-Daten der 8 Hotels
        const hotels = [
            { 
                name: "Dream World Palace", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D112007%26iid%3D137248819" 
            },
            { 
                name: "Hotel Delphin Diva", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D24352%26iid%3D72347130" 
            },
            { 
                name: "Dream Fun World", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D110452%26iid%3D136777641" 
            },
            { 
                name: "Hotel Delphin Imperial", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D25178%26iid%3D79456210" 
            },
            { 
                name: "Lago Hotel", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D111892%26iid%3D137119022" 
            },
            { 
                name: "Aydinbey Kings Palace & Spa", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D24146%26iid%3D136902608" 
            },
            { 
                name: "Titanic Deluxe Lara", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D22928%26iid%3D69099013" 
            },
            { 
                name: "Sea Shell Resort & Spa", 
                image: "https://media-cdn.holidaycheck.com/image/fetch/w_300,h_200,c_fill,q_auto,f_auto/https%3A%2F%2Fi.giatamedia.com%2Fs.php%3Fuid%3D1035%26source%3Dxmlpool2%26size%3D800%26cid%3D23603%26iid%3D118408120" 
            }
        ];

        async function init() {
            const csvRes = await fetch('preishistorie.csv?' + new Date().getTime());
            const csvText = await csvRes.text();
            const rows = csvText.split('\n').slice(1);

            const latestPrices = {};
            const historyData = {};

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 3 && cols[0].trim() !== "") {
                    const time = cols[0].trim();
                    const hotelName = cols[1].trim();
                    const price = parseFloat(cols[2].trim());

                    latestPrices[hotelName] = { price: isNaN(price) ? cols[2].trim() : price + " €" };

                    if (!historyData[hotelName]) historyData[hotelName] = { times: [], prices: [] };
                    if (!historyData[hotelName].times.includes(time)) {
                        historyData[hotelName].times.push(time);
                        historyData[hotelName].prices.push(isNaN(price) ? null : price);
                    }
                }
            });

            // Grid mit echten Hotelbildern rendern
            const grid = document.getElementById('hotelGrid');
            grid.innerHTML = "";
            hotels.forEach(h => {
                const info = latestPrices[h.name] || { price: "Wartet auf Daten..." };
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${h.image}" alt="${h.name}">
                    </div>
                    <div class="card-body">
                        <div class="card-title">${h.name}</div>
                        <div class="price-tag">${info.price}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Chart.js Diagramm
            const datasets = [];
            const colors = ['#1a73e8', '#ea4335', '#fbbc05', '#34a853', '#ff6d01', '#46bdc6', '#7b1fa2', '#e91e63'];
            let colorIndex = 0;

            for (const [hotelName, data] of Object.entries(historyData)) {
                datasets.push({
                    label: hotelName,
                    data: data.prices,
                    borderColor: colors[colorIndex % colors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 2.5,
                    tension: 0.2,
                    spanGaps: true
                });
                colorIndex++;
            }

            const allTimes = [...new Set(Object.values(historyData).flatMap(d => d.times))].sort();

            const ctx = document.getElementById('comparisonChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: { labels: allTimes, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { title: { display: true, text: 'Preisentwicklung im direkten Vergleich (EUR)' } },
                    scales: { y: { ticks: { callback: v => v + ' €' } } }
                }
            });
        }
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel-Preisvergleich Türkische Riviera 2027</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 26px; color: #1a73e8; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 25px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; position: relative; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); border-left: 4px solid #1a73e8; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: bold; color: #222; }
        .link-icon { font-size: 13px; color: #1a73e8; }
        
        .price-box { display: flex; align-items: baseline; gap: 10px; margin: 5px 0; }
        .price-tag { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .trend { font-size: 14px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .trend.down { background: #e6f4ea; color: #137333; }
        .trend.up { background: #fce8e6; color: #c5221f; }
        .trend.same { background: #f1f3f4; color: #5f6368; }

        .history-low { font-size: 12px; color: #666; margin-top: 5px; border-top: 1px solid #eee; padding-top: 6px; }
        .hint { font-size: 11px; color: #888; margin-top: 6px; }

        .chart-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel-Preisvergleich Türkische Riviera (Juni 2027)</h1>
        <div class="subtitle">Täglicher, automatisierter Gesamtpreis-Check (2 Erw., All Inclusive, ab FMO/BRE). Automatisch nach Bestpreis sortiert.</div>

        <div class="grid" id="hotelGrid"></div>

        <div class="chart-box">
            <canvas id="comparisonChart"></canvas>
        </div>
    </div>

    <script>
        const hotelsMeta = {
            "Dream World Palace": "https://www.holidaycheck.de/ho/angebote-dream-world-palace-hotel/5f99a171-6caa-4aff-aa4b-d7dbf273672d/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=f5c87011-c648-41d0-8e99-b2cc16cb70e6",
            "Hotel Delphin Diva": "https://www.holidaycheck.de/ho/angebote-hotel-delphin-diva/985cf6d5-a336-3c25-b3ed-44c54a262db6/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=146ad779-248d-43f7-8143-9bf0e7f6cfe9",
            "Dream Fun World": "https://www.holidaycheck.de/ho/angebote-dream-fun-world/3105f0fc-dd6f-4317-b536-933a40650f16/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=516308f5-ae64-461a-bc03-0cfeadf059e2",
            "Hotel Delphin Imperial": "https://www.holidaycheck.de/ho/angebote-hotel-delphin-imperial/7ce75659-2749-3030-bb0b-73785de4852a/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=1e188869-e757-422f-a7b7-2e1e82c104a9",
            "Lago Hotel": "https://www.holidaycheck.de/ho/angebote-lago-hotel/2e44d958-7e5e-4423-92b2-84bb298826b0/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=74bdf8cd-b80a-4d82-9f7a-37f9d48ac126",
            "Aydinbey Kings Palace & Spa": "https://www.holidaycheck.de/ho/angebote-aydinbey-kings-palace-spa/859de05c-795d-3c57-8271-ee31eca92fe1/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=eb1ef46f-ea63-40ab-9b69-bc0cdb68b6ab",
            "Titanic Deluxe Lara": "https://www.holidaycheck.de/ho/angebote-titanic-deluxe-lara/94cad83d-4b34-34b0-a334-cf80482827f3/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=73b4ffbb-d448-4665-aada-e130765e5521",
            "Sea Shell Resort & Spa": "https://www.holidaycheck.de/ho/angebote-sea-shell-resort-spa/33f5eb64-f7da-36d7-ace0-ff41d1bb9337/package?_offer=airport:~BRE~FMO,deal:1,departureDate:2027-06-14,duration:7,returnDate:2027-06-30,rooms:a-a&hcdid=46b24cd8-1afb-4d4f-9ff8-031819bd05b2"
        };

        async function init() {
            const csvRes = await fetch('preishistorie.csv?' + new Date().getTime());
            const csvText = await csvRes.text();
            const rows = csvText.split('\n').slice(1);

            const hotelStats = {};

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 3 && cols[0].trim() !== "") {
                    const time = cols[0].trim();
                    const hotelName = cols[1].trim();
                    const price = parseFloat(cols[2].trim());

                    if (!hotelStats[hotelName]) {
                        hotelStats[hotelName] = { times: [], prices: [], rawPrices: [] };
                    }
                    
                    hotelStats[hotelName].times.push(time);
                    hotelStats[hotelName].prices.push(isNaN(price) ? null : price);
                    if (!isNaN(price)) {
                        hotelStats[hotelName].rawPrices.push(price);
                    }
                }
            });

            // Aufbereiten für die Kacheln & Sortierung nach Bestpreis
            const displayList = [];

            for (const [hotelName, data] of Object.entries(hotelStats)) {
                const validPrices = data.rawPrices;
                const currentPrice = validPrices.length > 0 ? validPrices[validPrices.length - 1] : null;
                const prevPrice = validPrices.length > 1 ? validPrices[validPrices.length - 2] : null;
                const minPrice = validPrices.length > 0 ? Math.min(...validPrices) : null;

                let trendHTML = '';
                if (currentPrice && prevPrice) {
                    if (currentPrice < prevPrice) {
                        trendHTML = `<span class="trend down">↘ -${prevPrice - currentPrice} €</span>`;
                    } else if (currentPrice > prevPrice) {
                        trendHTML = `<span class="trend up">↗ +${currentPrice - prevPrice} €</span>`;
                    } else {
                        trendHTML = `<span class="trend same">→ 0 €</span>`;
                    }
                }

                displayList.push({
                    name: hotelName,
                    current: currentPrice,
                    currentStr: currentPrice ? currentPrice + " €" : "Kein Angebot",
                    minStr: minPrice ? minPrice + " €" : "N/A",
                    trend: trendHTML,
                    url: hotelsMeta[hotelName] || "#"
                });
            }

            // Automatische Bestpreis-Sortierung (Günstigste zuerst)
            displayList.sort((a, b) => {
                if (a.current === null) return 1;
                if (b.current === null) return -1;
                return a.current - b.current;
            });

            // Grid rendern
            const grid = document.getElementById('hotelGrid');
            grid.innerHTML = "";
            displayList.forEach(h => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = h.url;
                card.target = '_blank';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div class="card-title">${h.name}</div>
                            <div class="link-icon">🔗 Ansehen</div>
                        </div>
                        <div class="price-box">
                            <div class="price-tag">${h.currentStr}</div>
                            ${h.trend}
                        </div>
                        <div class="history-low">Bisher günstigster Preis: <b>${h.minStr}</b></div>
                    </div>
                    <div class="hint">Klicken zum HolidayCheck-Angebot &rarr;</div>
                `;
                grid.appendChild(card);
            });

            // Chart.js Diagramm
            const datasets = [];
            const colors = ['#1a73e8', '#ea4335', '#fbbc05', '#34a853', '#ff6d01', '#46bdc6', '#7b1fa2', '#e91e63'];
            let colorIndex = 0;

            for (const [hotelName, data] of Object.entries(hotelStats)) {
                datasets.push({
                    label: hotelName,
                    data: data.prices,
                    borderColor: colors[colorIndex % colors.length],
                    backgroundColor: 'transparent',
                    borderWidth: 2.5,
                    tension: 0.2,
                    spanGaps: true
                });
                colorIndex++;
            }

            const allTimes = [...new Set(Object.values(hotelStats).flatMap(d => d.times))].sort();

            const ctx = document.getElementById('comparisonChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: { labels: allTimes, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { title: { display: true, text: 'Preisentwicklung im direkten Vergleich (EUR)' } },
                    scales: { y: { ticks: { callback: v => v + ' €' } } }
                }
            });
        }
        init();
    </script>
</body>
</html>
